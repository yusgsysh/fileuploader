[package]
name = "fileuploader"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Self-hosted streaming download to S3 multipart upload manager"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1"
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
# Optimized for fast CI/Docker builds. The workload is I/O-bound, so full LTO
# and single-codegen-unit compilation only add build time.
lto = false
codegen-units = 16
strip = "symbols"
