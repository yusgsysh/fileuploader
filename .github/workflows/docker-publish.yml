name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize container image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "name=${REGISTRY}/${owner}/${repo,,}" >> "$GITHUB_OUTPUT"
          echo "package=${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Make GHCR package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.image.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail

          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "${owner_type}" = "Organization" ]; then
            endpoint="/orgs/${OWNER}/packages/container/${PACKAGE}/visibility"
          else
            endpoint="/user/packages/container/${PACKAGE}/visibility"
          fi

          if gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${endpoint}" \
            -f visibility=public >/tmp/ghcr-visibility.json 2>/tmp/ghcr-visibility.err; then
            echo "::notice title=GHCR visibility::${REGISTRY}/${OWNER}/${PACKAGE} is public"
          else
            echo "::warning title=GHCR visibility::Could not set the package to public automatically"
            cat /tmp/ghcr-visibility.err || true
            echo "Set it once at https://github.com/users/${OWNER}/packages/container/${PACKAGE}/settings"
            echo "or configure a GHCR_ADMIN_TOKEN secret with package admin permissions."
            echo "The image was still published successfully; only visibility needs attention."
          fi

      - name: Write job summary
        if: always()
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Container image"
            echo
            echo '```'
            echo "${IMAGE_TAGS:-no tags produced}"
            echo '```'
            if [ -n "${IMAGE_DIGEST:-}" ]; then
              echo "Digest: \`${IMAGE_DIGEST}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
